name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: konvex_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TESTE: postgresql://postgres:postgres@localhost:5432/konvex_teste
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Compilação
        run: npm run build
      - name: Testes (sem banco)
        run: npm test
      - name: Integração com PostgreSQL
        run: npm run test:integracao
      - name: Integração com PostgreSQL no fuso de São Paulo
        run: npm run test:integracao
        env:
          TZ: America/Sao_Paulo
      - name: Compose de produção válido
        run: |
          cp deploy/.env.prod.example deploy/.env
          docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
